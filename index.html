<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_LOGO = "https://images.unsplash.com/photo-1616949755610-8c9bbc08f138?auto=format&fit=crop&q=80&w=300";
    const DEFAULT_BANNER = "https://images.unsplash.com/photo-1583445013765-46c20c4a6772?auto=format&fit=crop&q=80&w=1600";

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        brand: 'Carolina Herrera',
        name: '212 VIP Black',
        volume: '100 ML',
        category: 'Hombre',
        price: 280000,
        oldPrice: 350000,
        image: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&q=80&w=600',
        notes: 'Absenta, Lavanda aromática, Vainilla Negra dulce y maderas orientales.',
        badge: 'MÁS VENDIDO',
        isArab: false
      },
      {
        id: '2',
        brand: 'Dior',
        name: 'Sauvage Eau de Parfum',
        volume: '100 ML',
        category: 'Hombre',
        price: 320000,
        oldPrice: 390000,
        image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&q=80&w=600',
        notes: 'Bergamota de Calabria fresca, Pimienta de Sichuan picante y Vainilla de Papúa.',
        badge: 'TENDENCIA',
        isArab: false
      }
    ];

    // Compresión automática de fotos para guardar en Firestore
    const compressImage = (file, maxWidth, quality, callback) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const base64 = canvas.toDataURL('image/jpeg', quality);
          callback(base64);
        };
      };
      reader.readAsDataURL(file);
    };

    function App() {
      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('gf_products');
        return local ? JSON.parse(local) : INITIAL_PRODUCTS;
      });
      const [selectedProduct, setSelectedProduct] = useState(null);

      const [logoUrl, setLogoUrl] = useState(() => localStorage.getItem('gf_logo') || DEFAULT_LOGO);
      const [bannerUrl, setBannerUrl] = useState(() => localStorage.getItem('gf_banner') || DEFAULT_BANNER);
      const [whatsappNumber, setWhatsappNumber] = useState(() => localStorage.getItem('gf_whatsapp') || '573000000000');
      
      // CONFIGURACIÓN DE FIREBASE INTEGRADA (Rellena aquí tus 6 claves reales)
      const [fbConfig, setFbConfig] = useState(() => {
        const saved = localStorage.getItem('gf_fb_config');
        return saved ? JSON.parse(saved) : { 
          apiKey: "AIzaSyAM24gsC-Dz0wGvZwgw3DPqU-SM_OzC7BQ", 
          authDomain: "gold-fragance.firebaseapp.com", 
          projectId: "gold-fragance", 
          storageBucket: "gold-fragance.firebasestorage.app", 
          messagingSenderId: "759429673865", 
          appId: "1:759429673865:web:49c93ab3d0083fa7762758" 
        };
      });

      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Modo local (Sin Firebase conectado)');

      const [viewMode, setViewMode] = useState('client');
      const [selectedCategory, setSelectedCategory] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');

      const [adminPin, setAdminPin] = useState('');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [adminTab, setAdminTab] = useState('products');
      const [editingProduct, setEditingProduct] = useState(null);

      const [formData, setFormData] = useState({
        brand: '', name: '', volume: '100 ML', category: 'Hombre', price: '', oldPrice: '', image: '', notes: '', badge: '', isArab: false
      });

      useEffect(() => { localStorage.setItem('gf_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('gf_logo', logoUrl); }, [logoUrl]);
      useEffect(() => { localStorage.setItem('gf_banner', bannerUrl); }, [bannerUrl]);
      useEffect(() => { localStorage.setItem('gf_whatsapp', whatsappNumber); }, [whatsappNumber]);
      useEffect(() => { localStorage.setItem('gf_fb_config', JSON.stringify(fbConfig)); }, [fbConfig]);

      useEffect(() => {
        if (!fbConfig.apiKey || !fbConfig.projectId || fbConfig.apiKey === "PON_AQUI_TU_API_KEY") {
          setSyncStatus('⚠️ Firebase no configurado (Haz clic en "Configurar Firebase")');
          return;
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(fbConfig);
          }
          const db = firebase.firestore();

          const unsubConfig = db.collection("settings").doc("storeConfig").onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              if (data.logo) setLogoUrl(data.logo);
              if (data.banner) setBannerUrl(data.banner);
              if (data.whatsapp) setWhatsappNumber(data.whatsapp);
              setSyncStatus('● Conectado y Sincronizado en Vivo');
            }
          }, () => {});

          const unsubProducts = db.collection("products").onSnapshot((snapshot) => {
            if (snapshot && !snapshot.empty) {
              let cloudProds = [];
              snapshot.forEach(doc => cloudProds.push({ id: doc.id, ...doc.data() }));
              setProducts(cloudProds);
            }
          }, () => {});

          return () => {
            unsubConfig();
            unsubProducts();
          };
        } catch (err) {
          setSyncStatus('❌ Error en credenciales de Firebase');
        }
      }, [fbConfig]);

      const getDb = () => {
        try {
          if (firebase.apps.length) return firebase.firestore();
        } catch(e) {}
        return null;
      };

      const processFileSelection = (e, storeKey = null, callback = null, maxWidth = 600) => {
        const file = e.target.files[0];
        if (!file) return;

        compressImage(file, maxWidth, 0.7, (base64) => {
          if (callback) callback(base64);
          const db = getDb();
          if (storeKey && db) {
            db.collection("settings").doc("storeConfig").set({ [storeKey]: base64 }, { merge: true });
          }
          alert('¡Imagen cargada correctamente!');
        });
      };

      const filteredProducts = products.filter(product => {
        const matchesCategory = selectedCategory === 'Todos' || 
                                (selectedCategory === 'Árabes' ? product.isArab || product.category === 'Árabes' : product.category === selectedCategory);
        const matchesSearch = product.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              product.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (product.notes && product.notes.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      const formatPrice = (amount) => {
        return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(amount);
      };

      const getWhatsAppLink = (productName = null) => {
        const cleanNumber = whatsappNumber.replace(/[^0-9]/g, '');
        const text = productName 
          ? `Hola GOLD FRAGANCE, me interesa obtener información y comprar el perfume: *${productName}*.`
          : `Hola GOLD FRAGANCE, deseo obtener información sobre precios al por mayor en Ibagué.`;
        return `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}`;
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPin === '0798') {
          setIsAuthenticated(true);
          setAdminPin('');
        } else {
          alert('PIN incorrecto.');
        }
      };

      const handleProductSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.price) return;

        const newProd = {
          ...formData,
          id: editingProduct ? editingProduct.id : Date.now().toString(),
          price: Number(formData.price),
          oldPrice: formData.oldPrice ? Number(formData.oldPrice) : null,
          image: formData.image || DEFAULT_LOGO
        };

        const db = getDb();
        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? newProd : p));
          if (db) db.collection("products").doc(editingProduct.id).set(newProd, { merge: true });
          setEditingProduct(null);
        } else {
          setProducts([newProd, ...products]);
          if (db) db.collection("products").doc(newProd.id).set(newProd);
        }

        setFormData({ brand: '', name: '', volume: '100 ML', category: 'Hombre', price: '', oldPrice: '', image: '', notes: '', badge: '', isArab: false });
        alert('Perfume guardado exitosamente.');
      };

      const handleEditProduct = (product) => {
        setEditingProduct(product);
        setFormData(product);
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('¿Estás seguro de eliminar este perfume?')) {
          setProducts(products.filter(p => p.id !== id));
          const db = getDb();
          if (db) db.collection("products").doc(id).delete();
        }
      };

      if (viewMode === 'admin') {
        return (
          <div className="min-h-screen bg-[#080B11] text-neutral-100 flex flex-col relative">
            
            {showFirebaseModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-neutral-900 border border-amber-500/40 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                    <h3 className="text-base font-bold text-amber-400 font-sans-title">⚙️ Configurar Conexión Firebase</h3>
                    <button onClick={() => setShowFirebaseModal(false)} className="text-neutral-400 hover:text-white text-lg">✕</button>
                  </div>
                  <p className="text-xs text-neutral-400">
                    Pega aquí las 6 claves de tu consola de Firebase para activar la sincronización en vivo.
                  </p>
                  
                  <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">API Key</label>
                      <input type="text" value={fbConfig.apiKey} onChange={(e) => setFbConfig({...fbConfig, apiKey: e.target.value})} placeholder="AIzaSy..." className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">Auth Domain</label>
                      <input type="text" value={fbConfig.authDomain} onChange={(e) => setFbConfig({...fbConfig, authDomain: e.target.value})} placeholder="tu-app.firebaseapp.com" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">Project ID</label>
                      <input type="text" value={fbConfig.projectId} onChange={(e) => setFbConfig({...fbConfig, projectId: e.target.value})} placeholder="tu-proyecto-id" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">Storage Bucket</label>
                      <input type="text" value={fbConfig.storageBucket} onChange={(e) => setFbConfig({...fbConfig, storageBucket: e.target.value})} placeholder="tu-proyecto.appspot.com" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">Messaging Sender ID</label>
                      <input type="text" value={fbConfig.messagingSenderId} onChange={(e) => setFbConfig({...fbConfig, messagingSenderId: e.target.value})} placeholder="123456789" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-bold block mb-1">App ID</label>
                      <input type="text" value={fbConfig.appId} onChange={(e) => setFbConfig({...fbConfig, appId: e.target.value})} placeholder="1:12345:web:abc" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-mono" />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2 border-t border-neutral-800">
                    <button onClick={() => setShowFirebaseModal(false)} className="w-1/2 bg-neutral-800 hover:bg-neutral-700 text-white font-bold py-2.5 rounded-xl text-xs">Cancelar</button>
                    <button onClick={() => { setShowFirebaseModal(false); window.location.reload(); }} className="w-1/2 bg-amber-400 hover:bg-amber-300 text-black font-extrabold py-2.5 rounded-xl text-xs">Guardar y Conectar</button>
                  </div>
                </div>
              </div>
            )}

            <header className="bg-neutral-900 border-b border-amber-500/30 px-6 py-4 sticky top-0 z-40 shadow-xl">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-amber-400 text-black flex items-center justify-center font-black rounded-lg">⚙️</div>
                  <div>
                    <h1 className="text-lg font-bold text-white font-sans-title">Panel Administrativo</h1>
                    <p className="text-xs text-emerald-400 font-bold">{syncStatus}</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setShowFirebaseModal(true)}
                    className="bg-neutral-800 hover:bg-neutral-700 text-amber-400 border border-amber-500/30 font-semibold px-4 py-2 rounded-xl text-xs transition"
                  >
                    🔌 Configurar Firebase
                  </button>
                  <button
                    onClick={() => setViewMode('client')}
                    className="flex items-center gap-2 bg-amber-400 hover:bg-amber-300 text-neutral-950 font-extrabold px-4 py-2 rounded-xl text-xs transition-all shadow-lg active:scale-95"
                  >
                    👁️ Volver a la Tienda
                  </button>
                  {isAuthenticated && (
                    <button
                      onClick={() => setIsAuthenticated(false)}
                      className="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-3 py-2 rounded-xl text-xs font-semibold"
                    >
                      Cerrar Sesión
                    </button>
                  )}
                </div>
              </div>
            </header>

            <main className="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
              {!isAuthenticated ? (
                <div className="max-w-md mx-auto mt-16 bg-neutral-900 border border-amber-500/20 rounded-2xl p-8 space-y-6 text-center shadow-2xl">
                  <div className="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto text-2xl">🔒</div>
                  <div className="space-y-1">
                    <h2 className="text-xl font-bold text-white font-sans-title">Ingreso Privado</h2>
                    <p className="text-xs text-neutral-400">Introduce el PIN de seguridad</p>
                  </div>

                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input
                      type="password"
                      maxLength={4}
                      placeholder="••••"
                      value={adminPin}
                      onChange={(e) => setAdminPin(e.target.value)}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-center text-2xl text-amber-400 font-mono tracking-widest focus:outline-none focus:border-amber-500"
                      autoFocus
                    />
                    <button
                      type="submit"
                      className="w-full bg-amber-400 hover:bg-amber-300 text-neutral-950 font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg"
                    >
                      Entrar
                    </button>
                  </form>
                </div>
              ) : (
                <div className="space-y-8">
                  <div className="flex border-b border-neutral-800 space-x-2">
                    <button
                      onClick={() => setAdminTab('products')}
                      className={`px-5 py-3 text-xs font-bold rounded-t-xl transition-all ${
                        adminTab === 'products' ? 'bg-amber-400 text-neutral-950' : 'bg-neutral-900 text-neutral-400'
                      }`}
                    >
                      Gestión de Catálogo
                    </button>
                    <button
                      onClick={() => setAdminTab('branding')}
                      className={`px-5 py-3 text-xs font-bold rounded-t-xl transition-all ${
                        adminTab === 'branding' ? 'bg-amber-400 text-neutral-950' : 'bg-neutral-900 text-neutral-400'
                      }`}
                    >
                      Logo y Banner
                    </button>
                    <button
                      onClick={() => setAdminTab('whatsapp')}
                      className={`px-5 py-3 text-xs font-bold rounded-t-xl transition-all ${
                        adminTab === 'whatsapp' ? 'bg-amber-400 text-neutral-950' : 'bg-neutral-900 text-neutral-400'
                      }`}
                    >
                      Línea WhatsApp
                    </button>
                  </div>

                  {adminTab === 'products' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                      <div className="lg:col-span-5 bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-4 h-fit">
                        <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider">
                          {editingProduct ? 'Editar Perfume' : 'Agregar Perfume'}
                        </h3>

                        <form onSubmit={handleProductSubmit} className="space-y-3">
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">MARCA</label>
                              <input
                                type="text"
                                placeholder="Dior"
                                value={formData.brand}
                                onChange={(e) => setFormData({...formData, brand: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white"
                                required
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">NOMBRE</label>
                              <input
                                type="text"
                                placeholder="Sauvage"
                                value={formData.name}
                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white"
                                required
                              />
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">TAMAÑO (ML)</label>
                              <input
                                type="text"
                                placeholder="100 ML"
                                value={formData.volume}
                                onChange={(e) => setFormData({...formData, volume: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white"
                                required
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">CATEGORÍA</label>
                              <select
                                value={formData.category}
                                onChange={(e) => setFormData({...formData, category: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white"
                              >
                                <option value="Hombre">Hombre</option>
                                <option value="Mujer">Mujer</option>
                                <option value="Árabes">Árabes</option>
                                <option value="Unisex">Unisex</option>
                              </select>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">PRECIO ($ COP)</label>
                              <input
                                type="number"
                                placeholder="280000"
                                value={formData.price}
                                onChange={(e) => setFormData({...formData, price: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-amber-400 font-bold"
                                required
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-neutral-400 font-bold block mb-1">PRECIO ANTERIOR</label>
                              <input
                                type="number"
                                placeholder="350000"
                                value={formData.oldPrice || ''}
                                onChange={(e) => setFormData({...formData, oldPrice: e.target.value})}
                                className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-400"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-neutral-400 font-bold block mb-1">FOTO DE PERFUME (DESDE GALERÍA)</label>
                            <label className="flex items-center justify-center gap-2 w-full bg-neutral-950 border border-dashed border-neutral-700 hover:border-amber-400 rounded-xl p-3 text-xs text-neutral-300 cursor-pointer transition">
                              <span>📷 Seleccionar Foto de Galería</span>
                              <input
                                type="file"
                                accept="image/*"
                                onChange={(e) => processFileSelection(e, null, (base64) => setFormData({...formData, image: base64}), 600)}
                                className="hidden"
                              />
                            </label>
                            {formData.image && (
                              <div className="mt-2 flex items-center gap-3 bg-neutral-950 p-2 rounded-lg border border-neutral-800">
                                <img src={formData.image} className="w-10 h-10 object-cover rounded-md" />
                                <span className="text-[10px] text-emerald-400 font-bold">✓ Foto lista</span>
                              </div>
                            )}
                          </div>

                          <div>
                            <label className="text-[10px] text-neutral-400 font-bold block mb-1">NOTAS OLFATIVAS</label>
                            <textarea
                              placeholder="Notas principales y aromas..."
                              value={formData.notes}
                              onChange={(e) => setFormData({...formData, notes: e.target.value})}
                              className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white h-20"
                              required
                            />
                          </div>

                          <button
                            type="submit"
                            className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase transition"
                          >
                            {editingProduct ? 'Guardar Cambios' : '+ Publicar Perfume'}
                          </button>
                        </form>
                      </div>

                      <div className="lg:col-span-7 space-y-3">
                        <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider mb-2">
                          Productos Activos ({products.length})
                        </h3>
                        {products.map((p) => (
                          <div key={p.id} className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                              <img src={p.image} className="w-14 h-14 object-cover rounded-lg" />
                              <div>
                                <span className="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded">{p.volume}</span>
                                <h4 className="font-bold text-white text-sm">{p.name}</h4>
                                <p className="text-xs text-amber-400 font-bold">{formatPrice(p.price)}</p>
                              </div>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => handleEditProduct(p)} className="p-2 text-amber-400 hover:bg-neutral-800 rounded-lg">✏️</button>
                              <button onClick={() => handleDeleteProduct(p.id)} className="p-2 text-red-400 hover:bg-neutral-800 rounded-lg">🗑️</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {adminTab === 'branding' && (
                    <div className="max-w-2xl bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-6">
                      <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider">Visuales de Marca</h3>
                      
                      <div className="space-y-3">
                        <label className="text-xs font-bold text-neutral-300 block">LOGO PRINCIPAL (GALERÍA)</label>
                        <label className="flex items-center justify-center gap-2 w-full bg-neutral-950 border border-dashed border-neutral-700 hover:border-amber-400 rounded-xl p-4 text-xs text-neutral-200 cursor-pointer transition">
                          📁 Subir Logo desde Galería
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => processFileSelection(e, 'logo', (base64) => setLogoUrl(base64), 300)}
                            className="hidden"
                          />
                        </label>
                        <div className="flex items-center gap-4 pt-2">
                          <img src={logoUrl} className="w-16 h-16 object-cover bg-black rounded-none border border-neutral-800" />
                          <span className="text-xs text-neutral-400">Vista previa actual del logo.</span>
                        </div>
                      </div>

                      <div className="space-y-3 pt-4 border-t border-neutral-800">
                        <label className="text-xs font-bold text-neutral-300 block">BANNER PANORÁMICO (GALERÍA)</label>
                        <label className="flex items-center justify-center gap-2 w-full bg-neutral-950 border border-dashed border-neutral-700 hover:border-amber-400 rounded-xl p-4 text-xs text-neutral-200 cursor-pointer transition">
                          📁 Subir Banner desde Galería
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => processFileSelection(e, 'banner', (base64) => setBannerUrl(base64), 1200)}
                            className="hidden"
                          />
                        </label>
                        <div className="pt-2">
                          <img src={bannerUrl} className="w-full h-28 object-cover rounded-xl border border-neutral-800" />
                          <span className="text-xs text-neutral-400 mt-1 block">Vista previa actual del banner.</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {adminTab === 'whatsapp' && (
                    <div className="max-w-xl bg-neutral-900 border border-neutral-800 rounded-2xl p-6 space-y-4">
                      <h3 className="text-sm font-bold text-amber-400 uppercase tracking-wider">Número de Atención WhatsApp</h3>
                      <input
                        type="text"
                        value={whatsappNumber}
                        onChange={(e) => {
                          setWhatsappNumber(e.target.value);
                          const db = getDb();
                          if (db) db.collection("settings").doc("storeConfig").set({ whatsapp: e.target.value }, { merge: true });
                        }}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-white font-mono"
                      />
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#080B11] text-neutral-100 flex flex-col">
          
          <header className="bg-black border-b border-neutral-800 sticky top-0 z-40 px-4 sm:px-6 lg:px-8 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3 sm:space-x-4">
                <div className="w-12 h-12 rounded-none bg-black flex-shrink-0 overflow-hidden">
                  <img src={logoUrl} alt="GOLD FRAGANCE" className="w-full h-full object-cover" />
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl lg:text-3xl font-extrabold font-sans-title text-amber-400 leading-none">
                    GOLD FRAGANCE
                  </h1>
                  <p className="text-[9px] sm:text-[10px] tracking-[0.25em] text-neutral-400 font-bold uppercase mt-1">
                    TODO EN PERFUMES
                  </p>
                </div>
              </div>

              <div className="hidden lg:flex items-center space-x-2 bg-neutral-900 border border-neutral-700 px-5 py-2 rounded-full text-xs text-amber-300 shadow-md">
                <span>✨</span>
                <span className="font-semibold tracking-wide">Ventas al por Mayor desde 3 Unidades | Ibagué</span>
              </div>

              <a
                href={getWhatsAppLink()}
                target="_blank"
                rel="noopener noreferrer"
                className="bg-[#059669] hover:bg-[#047857] text-white font-bold px-4 sm:px-6 py-2.5 rounded-full text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-emerald-950/50 transition transform active:scale-95"
              >
                <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                  <path d="M12.012 2c-5.508 0-9.989 4.481-9.989 9.989 0 1.862.511 3.601 1.403 5.093l-1.426 5.21 5.347-1.402c1.439.784 3.084 1.229 4.821 1.229 5.508 0 9.989-4.481 9.989-9.989s-4.481-9.989-9.989-9.989zm0 18.277c-1.637 0-3.176-.452-4.502-1.239l-.323-.19-3.324.871.887-3.238-.208-.331c-.886-1.408-1.353-3.04-1.353-4.717 0-4.566 3.714-8.28 8.28-8.28s8.28 3.714 8.28 8.28-3.714 8.28-8.28 8.28z"/>
                </svg>
                <span>Cotizar Directo</span>
              </a>

            </div>
          </header>

          <section className="relative w-full h-[380px] sm:h-[460px] lg:h-[500px] overflow-hidden bg-black flex items-center justify-center">
            <img src={bannerUrl} alt="Banner Lujo Perfumes" className="absolute inset-0 w-full h-full object-cover filter brightness-75 scale-105" />
            <div className="absolute inset-0 bg-gradient-to-r from-[#080B11] via-[#080B11]/80 to-transparent"></div>
            <div className="absolute inset-0 bg-gradient-to-t from-[#080B11] via-transparent to-black/50"></div>

            <div className="absolute inset-0 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col justify-center items-start">
              <div className="max-w-2xl space-y-4">
                <div className="inline-flex items-center gap-2 bg-black/60 backdrop-blur-md border border-amber-500/40 text-amber-400 px-3.5 py-1.5 rounded-full text-[10px] sm:text-xs font-bold uppercase tracking-wider">
                  <span>🚚</span>
                  <span>DESPACHOS INMEDIATOS EN IBAGUÉ & TODO COLOMBIA</span>
                </div>

                <h2 className="text-3xl sm:text-5xl lg:text-6xl font-black font-sans-title text-white leading-none">
                  PERFUMERÍA IMPORTADA & <span className="text-amber-400">ÁRABE DE ALTA GAMA</span>
                </h2>

                <p className="text-neutral-300 text-xs sm:text-sm max-w-lg leading-relaxed font-light">
                  Encuentra las mejores fragancias de diseñador y perfumería oriental árabe con despachos garantizados.
                </p>

                <div className="pt-2">
                  <a
                    href={getWhatsAppLink()}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-3 bg-amber-400 hover:bg-amber-300 text-neutral-950 font-extrabold px-6 py-3.5 rounded-full shadow-xl text-xs sm:text-sm uppercase tracking-wider transition transform active:scale-95"
                  >
                    <span>Cotizar por WhatsApp</span>
                    <span>→</span>
                  </a>
                </div>
              </div>
            </div>
          </section>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-neutral-800">
              <div className="flex flex-wrap gap-2">
                {['Todos', 'Hombre', 'Mujer', 'Árabes', 'Unisex'].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                      selectedCategory === cat 
                        ? 'bg-amber-400 text-neutral-950 shadow-lg shadow-amber-400/20' 
                        : 'bg-neutral-900 text-neutral-400 hover:bg-neutral-800 hover:text-white'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="w-full md:w-72">
                <input
                  type="text"
                  placeholder="Buscar perfume o nota..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-amber-400"
                />
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              {filteredProducts.map((p) => (
                <div key={p.id} onClick={() => setSelectedProduct(p)} className="bg-neutral-900/60 border border-neutral-800/80 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-amber-400/50 transition cursor-pointer">
                  <div>
                    <div className="relative h-64 bg-black overflow-hidden">
                      <img src={p.image} alt={p.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                      <div className="absolute top-3 left-3 flex flex-col gap-1">
                        {p.badge && (
                          <span className="bg-amber-400 text-neutral-950 font-extrabold text-[9px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow">
                            {p.badge}
                          </span>
                        )}
                        <span className="bg-black/80 backdrop-blur-md text-amber-300 border border-amber-400/30 font-bold text-[9px] px-2.5 py-1 rounded-full w-fit">
                          {p.volume}
                        </span>
                      </div>
                    </div>

                    <div className="p-5 space-y-2">
                      <p className="text-[10px] text-amber-400 font-bold uppercase tracking-widest">{p.brand}</p>
                      <h3 className="text-base font-bold text-white font-sans-title leading-snug">{p.name}</h3>
                      <p className="text-xs text-neutral-400 line-clamp-2 font-light">{p.notes}</p>
                    </div>
                  </div>

                  <div className="p-5 pt-0 flex items-center justify-between border-t border-neutral-800/60 mt-4 pt-4">
                    <div>
                      <span className="text-xs text-neutral-500 line-through block">{p.oldPrice ? formatPrice(p.oldPrice) : ''}</span>
                      <span className="text-base font-black text-amber-400">{formatPrice(p.price)}</span>
                    </div>
                    <a
                      href={getWhatsAppLink(p.name)}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="bg-amber-400/10 hover:bg-amber-400 text-amber-400 hover:text-neutral-950 font-bold text-xs px-4 py-2 rounded-xl border border-amber-400/30 transition shadow"
                    >
                      Pedir
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </main>

          <footer className="bg-neutral-950 border-t border-neutral-900 py-8 px-4 text-center text-xs text-neutral-500 mt-20">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>© 2026 GOLD FRAGANCE - Todos los derechos reservados</p>
              <button
                onClick={() => setViewMode('admin')}
                className="text-neutral-600 hover:text-neutral-400 transition text-[11px]"
              >
                🔒 Acceso
              </button>
            </div>
          </footer>
          {/* VENTANA FLOTANTE (MODAL) */}
      {selectedProduct && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
          <div className="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-md w-full p-6 text-white relative shadow-2xl">
            
            {/* Botón para cerrar */}
            <button 
              onClick={() => setSelectedProduct(null)}
              className="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl font-bold bg-neutral-800 w-8 h-8 rounded-full flex items-center justify-center"
            >
              ✕
            </button>

            {/* Imagen */}
            <img 
              src={selectedProduct.image} 
              alt={selectedProduct.name} 
              className="w-full h-48 object-cover rounded-xl mb-4" 
            />

            {/* Información */}
            <h2 className="text-2xl font-bold mb-1 text-amber-400">{selectedProduct.name}</h2>
            <p className="text-sm text-neutral-400 mb-2">{selectedProduct.brand}</p>
            <p className="text-neutral-300 text-sm mb-4">{selectedProduct.description}</p>
            
            <div className="flex items-center justify-between mb-6">
              <span className="text-xl font-extrabold text-white">{selectedProduct.price}</span>
              <span className="text-xs bg-neutral-800 px-3 py-1 rounded-full text-amber-300">{selectedProduct.volume}</span>
            </div>

            {/* Botón de WhatsApp */}
            <a 
              href={`https://wa.me/573000000000?text=Hola,%20estoy%20interesado%20en%20el%20perfume%20${encodeURIComponent(selectedProduct.name)}`} 
              target="_blank" 
              rel="noopener noreferrer"
              className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition"
            >
              Pedir por WhatsApp
            </a>

          </div>
        </div>
      )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
